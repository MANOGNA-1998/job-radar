name: Keep schedule alive

# GitHub turns off scheduled workflows after 60 days with no repository activity.
on:
  schedule:
    - cron: "11 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%FT%TZ > .github/last-keepalive
          git config user.name "job-radar"
          git config user.email "job-radar@users.noreply.github.com"
          git add .github/last-keepalive
          git commit -m "Keep scheduled collection active"
          git push
