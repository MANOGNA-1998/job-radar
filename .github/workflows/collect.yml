name: Collect jobs

on:
  schedule:
    # Every 15 minutes, away from the top of the hour when GitHub's scheduler is busiest.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - run: python -m collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALERT_EMAIL_USER: ${{ secrets.ALERT_EMAIL_USER }}
          ALERT_EMAIL_APP_PASSWORD: ${{ secrets.ALERT_EMAIL_APP_PASSWORD }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          # True for the dashboard's Check now button and for runs started from the Actions tab.
          JR_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
